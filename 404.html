
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>AQX | جاري التحويل</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071426;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      width: min(90%, 420px);
      padding: 35px 25px;
      background: #10243d;
      border: 1px solid #1e4263;
      border-radius: 20px;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      color: #22d3ee;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 21px;
      margin: 22px 0 10px;
    }

    p {
      color: #b8c8d9;
      line-height: 1.8;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 25px auto 0;
      border: 4px solid #29445e;
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      color: #fca5a5;
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">AQX</div>
    <h1>جاري تجهيز الرابط المختصر</h1>
    <p>انتظر لحظة، سيتم توجيهك إلى صفحة التحويل الآمنة.</p>
    <div class="loader"></div>
    <p class="error" id="error">
      الرابط غير صالح أو لا يحتوي على رمز صحيح.
    </p>
  </main>

  <script>
    (() => {
      const path = window.location.pathname;
      const match = path.match(/^\/r\/([A-Za-z0-9_-]+)\/?$/);

      if (!match) {
        document.querySelector(".loader").style.display = "none";
        document.getElementById("error").style.display = "block";
        return;
      }

      const code = match[1];

      // الاحتفاظ بالرمز وتمريره إلى صفحة التحويل
      const target = new URL("/redirect.html", window.location.origin);
      target.searchParams.set("code", code);

      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
