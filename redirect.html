<script>
"use strict";

/* ===== حماية الواجهة ===== */
(function(){
  try{ if(window.top!==window.self){ window.top.location=window.self.location; } }catch(e){ document.documentElement.innerHTML=""; }
  const stop=e=>e.preventDefault();
  ["contextmenu","dragstart","selectstart","copy","cut"].forEach(t=>document.addEventListener(t,stop));
  document.addEventListener("keydown",e=>{
    const k=(e.key||"").toLowerCase();
    if(e.key==="F12"||(e.ctrlKey&&["u","s","p"].includes(k))||((e.ctrlKey||e.metaKey)&&e.shiftKey&&["i","j","c","k"].includes(k))||(e.metaKey&&e.altKey&&["i","u"].includes(k))){e.preventDefault();e.stopPropagation();}
  },true);
})();

/* ===== إعدادات محرك AQX (كما هي) ===== */
const API_BASE="https://vuszqzgldbsscuxdfhdz.supabase.co/functions/v1/aqx-engine";
const PUBLIC_KEY="sb_publishable_cI7C0sL9M4OLvsa-JGAAFQ_KfqlkI7X";

const timerElement=document.getElementById("timer");
const unitElement=document.getElementById("unit");
const statusElement=document.getElementById("status");
const ringElement=document.getElementById("ring");
const CIRC=2*Math.PI*52;

let finished=false;

function setTimer(text,showUnit){
  timerElement.textContent=text;
  unitElement.style.display=showUnit?"":"none";
}
function setRing(fraction){
  const f=Math.min(1,Math.max(0,fraction));
  ringElement.style.strokeDashoffset=String(CIRC*(1-f));
}

function getShortCode(){
  const path=window.location.pathname;
  const match=path.match(/\/r\/([A-Za-z0-9_-]{3,64})\/?$/);
  if(match){return match[1];}
  const params=new URLSearchParams(window.location.search);
  const code=params.get("code");
  if(code&&/^[A-Za-z0-9_-]{3,64}$/.test(code)){return code;}
  return null;
}

function showError(message){
  finished=true;
  setTimer("!",false);
  setRing(0);
  statusElement.textContent=message;
  statusElement.className="status error";
}

async function apiRequest(endpoint,body){
  const response=await fetch(API_BASE+endpoint,{
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":PUBLIC_KEY},
    body:JSON.stringify(body),
    cache:"no-store",
    redirect:"error"
  });
  const data=await response.json().catch(()=>({}));
  return {ok:response.ok,status:response.status,data};
}

async function startSession(code){
  const result=await apiRequest("/redirect/start",{code:code});
  if(!result.ok||!result.data.ok||typeof result.data.session_id!=="string"||!Number.isInteger(result.data.wait_seconds)||result.data.wait_seconds<0){
    throw new Error(result.data.message||"تعذر إنشاء جلسة التحويل.");
  }
  return result.data;
}

async function completeSession(sessionId){
  const result=await apiRequest("/redirect/complete",{session_id:sessionId});

  if(result.ok&&result.data.ok&&typeof result.data.redirect_url==="string"){
    const destination=new URL(result.data.redirect_url);
    if(destination.protocol!=="https:"&&destination.protocol!=="http:"){
      throw new Error("وجهة التحويل غير صالحة.");
    }
    finished=true;
    statusElement.textContent="تم التحقق، جارٍ تحويلك الآن...";
    setTimer("✓",false);
    setRing(1);
    window.location.replace(destination.href);
    return;
  }

  if(result.status===403&&result.data.error==="wait_not_finished"){
    const remaining=Number(result.data.remaining_seconds);
    if(Number.isFinite(remaining)&&remaining>0){
      setTimer(String(Math.ceil(remaining)),true);
      statusElement.textContent="جارٍ استكمال التحقق من مدة الانتظار...";
      await new Promise(resolve=>setTimeout(resolve,Math.min(remaining*1000,30000)));
      return completeSession(sessionId);
    }
  }
  throw new Error(result.data.message||"تعذر إتمام جلسة التحويل.");
}

async function runCountdown(session){
  const total=session.wait_seconds;
  let remaining=total;
  setTimer(String(remaining),true);
  setRing(1);

  if(remaining===0){
    statusElement.textContent="جارٍ التحقق من جلسة التحويل...";
    return completeSession(session.session_id);
  }

  statusElement.textContent="يرجى الانتظار حتى انتهاء العد التنازلي.";
  const deadline=performance.now()+remaining*1000;

  while(remaining>0&&!finished){
    await new Promise(resolve=>setTimeout(resolve,200));
    const msLeft=Math.max(0,deadline-performance.now());
    setRing(msLeft/(total*1000));
    const nextValue=Math.ceil(msLeft/1000);
    if(nextValue!==remaining){
      remaining=nextValue;
      setTimer(String(remaining),true);
    }
  }

  if(finished)return;
  setTimer("✓",false);
  setRing(0);
  statusElement.textContent="انتهى العد، جارٍ التحقق من الخادم...";
  await completeSession(session.session_id);
}

async function initialize(){
  try{
    const code=getShortCode();
    if(!code){throw new Error("رمز الرابط غير صالح أو غير موجود.");}
    const session=await startSession(code);
    await runCountdown(session);
  }catch(error){
    showError(error&&error.message?error.message:"حدث خطأ أثناء الاتصال بمحرك AQX.");
  }
}

initialize();
</script>
